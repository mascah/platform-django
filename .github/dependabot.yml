# Config for Dependabot updates. See Documentation here:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Update GitHub actions in workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      github-actions:
        patterns:
          - '*'

  # Enable version updates for Docker
  - package-ecosystem: 'docker'
    directories:
      - 'docker/production/django/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'docker'
    # Ignore minor version updates (3.13 -> 3.14) but update patch versions
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    groups:
      docker-python:
        patterns:
          - '*'

  # Enable version updates for Docker Compose files
  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'docker'

  # Enable version updates for Python/uv
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'python'
    groups:
      python:
        update-types:
          - 'minor'
          - 'patch'

  # Enable version updates for javascript/npm (pnpm)
  - package-ecosystem: 'npm'
    # Covers root package.json and all workspace packages
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      # eslint core and its plugins must move together — majors are gated on each
      # other's peer ranges, so a lone bump can never pass CI. Majors included
      # deliberately (no update-types filter), unlike the catch-all group below.
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      javascript:
        update-types:
          - 'minor'
          - 'patch'
