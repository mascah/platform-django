name: CI

on:
  push:
    branches: ['main']
    paths-ignore: ['docs/**']
  pull_request:
    branches: ['main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Detect which areas of the codebase changed so downstream jobs can be skipped.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'platform_django/**'
              - 'libs/**'
              - 'config/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'docker/**'
              - 'docker-compose.yml'
              - '.env.ci'
              - 'manage.py'
              - '.importlinter'
              - 'lefthook.yml'
              - '.github/**'
            typescript:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - 'e2e/**'
              - 'lefthook.yml'
              - '.github/**'
            # Deliberately narrow: only what can actually break bootstrap. On a
            # typical change this job does not run at all.
            bootstrap:
              - 'bin/bootstrap'
              - 'bin/env-refresh'
              - 'mise.toml'
              - '.python-version'
              - '.nvmrc'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.env.example'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Linter — runs all checks via lefthook (single source of truth).
  # ---------------------------------------------------------------------------
  lint:
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup CI environment
        run: |
          cp .env.ci .env
          # Export env vars for tools that run outside Django (e.g., mypy)
          grep -v '^#' .env.ci | grep -v '^$' >> $GITHUB_ENV

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Install lefthook
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64) SUFFIX="arm64" ;;
            *)       SUFFIX="x86_64" ;;
          esac
          wget -q "https://github.com/evilmartians/lefthook/releases/download/v2.0.12/lefthook_2.0.12_Linux_${SUFFIX}" -O /tmp/lefthook
          chmod +x /tmp/lefthook
          sudo mv /tmp/lefthook /usr/local/bin/lefthook

      - name: Run lefthook CI checks
        run: |
          lefthook run pre-commit --all-files
          # Fail if any files were modified by auto-fixers (excluding lock files)
          git diff --exit-code -- ':!uv.lock' ':!pnpm-lock.yaml' ':!CHANGELOG.md' || (echo "Files were modified by linters. Please run 'lefthook run pre-commit --all-files' locally and commit the changes." && exit 1)

  # ---------------------------------------------------------------------------
  # Agent mirrors — a skill added without its mirrors is a build failure.
  # Runs the same script `just sync-agents` runs, then fails on any diff. No
  # toolchain: the script is bash, find and ln.
  # ---------------------------------------------------------------------------
  agent-mirrors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Sync agent harness mirrors
        run: ./bin/sync-agents

      - name: Fail if the mirrors were out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "Agent mirrors are out of date. Run 'just sync-agents' and commit the result."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Generated API client — a serializer changed without regenerating the client
  # is a build failure, in the same shape as agent-mirrors: run the generator,
  # then fail on any diff.
  #
  # This is the check that makes the client safe to merge. A downstream project
  # and the template both regenerate it, drf-spectacular sorts components
  # alphabetically, and so their edits interleave rather than collide — git
  # merges them without a conflict into a file no schema ever produced. Nothing
  # about that is visible in review, because a stale .gen.ts diff looks exactly
  # like an absent one.
  #
  # The schema is dumped rather than fetched from a running server, so there is
  # no database, no Redis, no gunicorn and no port to agree on.
  # ---------------------------------------------------------------------------
  openapi-client:
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Setup CI environment
        run: |
          cp .env.ci .env
          grep -v '^#' .env.ci | grep -v '^$' >> $GITHUB_ENV

      - name: Regenerate the client from the current schema
        run: |
          uv run python manage.py spectacular --file /tmp/openapi-schema.yaml
          cd apps/platform_django && pnpm openapi-ts -i /tmp/openapi-schema.yaml

      - name: Fail if the committed client is out of date
        run: |
          if [ -n "$(git status --porcelain apps/platform_django/src/services)" ]; then
            git diff -- apps/platform_django/src/services
            echo "The committed API client does not match the current schema. Run 'just openapi' and commit the result."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Test & build jobs — only run when relevant files change
  # ---------------------------------------------------------------------------
  pytest:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: platform_django
          POSTGRES_USER: platform_django
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          # Full history, so `lintmigrations --git-commit-id origin/main` has a
          # main to diff against and can tell which migrations this branch added.
          fetch-depth: 0

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env

      - name: Setup CI environment
        run: |
          cp .env.ci .env
          # Export env vars so Django can read them (no Docker entrypoint to do this)
          grep -v '^#' .env.ci | grep -v '^$' >> $GITHUB_ENV

      - name: Check DB Migrations
        run: uv run python manage.py makemigrations --check

      # Migrations are applied before the new code is serving, so an old process
      # briefly runs against the new schema. Anything that breaks it in that
      # window — DROP or RENAME of a column or table, ADD NOT NULL without a
      # default, ALTER of a column type — fails here. Only migrations this branch
      # added are checked, so an existing backlog is never re-flagged.
      - name: Lint DB Migrations
        run: uv run python manage.py lintmigrations --git-commit-id origin/main --project-root-path .

      - name: Run DB Migrations
        run: uv run python manage.py migrate

      - name: Run Django Tests with Coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

  # ---------------------------------------------------------------------------
  # Bootstrap — proves a fresh checkout is runnable on a bare machine.
  # Runs in a stock Ubuntu container rather than on the runner itself: the
  # runner already ships Python, Node, uv and Homebrew, so it is not the bare
  # machine bootstrap is designed for and would prove nothing. Root, no package
  # manager beyond the two baseline utilities, unattended.
  # ---------------------------------------------------------------------------
  bootstrap:
    needs: changes
    if: needs.changes.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Bootstrap a clean checkout as root, twice
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ubuntu:24.04 bash -eux -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl ca-certificates git
            test "$(id -u)" -eq 0
            ! command -v brew
            ! command -v direnv

            ./bin/bootstrap

            # Idempotent: running it twice is harmless.
            ./bin/bootstrap

            # It really is runnable: the pinned toolchain, both dependency sets
            # and the environment file are all present.
            test -f .env
            export PATH="$HOME/.local/bin:$PATH"
            mise exec -- node --version
            mise exec -- uv run python -c "import django; print(django.__version__)"
            mise exec -- pnpm --version
            test -d node_modules
          '

  vitest:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Run vitest
        run: pnpm test

  # ---------------------------------------------------------------------------
  # E2E tests — runs Playwright against Django + built frontend.
  # Uses service containers (no Docker build) — Django runs natively on the
  # GHA runner with the built frontend accessible on the local filesystem.
  # ---------------------------------------------------------------------------
  e2e:
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: platform_django
          POSTGRES_USER: platform_django
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Build frontend
        run: pnpm build

      - name: Setup CI environment
        run: |
          cp .env.ci .env
          grep -v '^#' .env.ci | grep -v '^$' >> $GITHUB_ENV

      - name: Run DB Migrations
        run: uv run python manage.py migrate

      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput

      - name: Create E2E test user
        run: uv run python manage.py create_e2e_user

      - name: Start Django server
        run: |
          uv run gunicorn config.wsgi --bind 0.0.0.0:8000 --no-control-socket --preload --access-logfile - --error-logfile - > django-e2e.log 2>&1 &
          timeout 30 bash -c 'until curl -s http://localhost:8000/healthz/ > /dev/null 2>&1; do sleep 1; done'
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local

      - name: Install Playwright browsers
        run: cd e2e && pnpm exec playwright install --only-shell --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Django server logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: django-e2e-logs
          path: django-e2e.log
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Fan-in job — use as the single required status check in branch protection.
  # Passes when all conditional jobs either succeed or are skipped.
  # ---------------------------------------------------------------------------
  ci-success:
    if: always()
    needs: [changes, lint, pytest, vitest, e2e, bootstrap, openapi-client]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.pytest.result }}"
            "${{ needs.vitest.result }}"
            "${{ needs.e2e.result }}"
            "${{ needs.bootstrap.result }}"
            "${{ needs['openapi-client'].result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "Job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
