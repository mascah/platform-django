# =============================================================================
# The pinned toolchain, installed identically on macOS and Linux
# =============================================================================
# bin/bootstrap installs everything declared here, assuming no package manager.
#
# The runtime versions deliberately do NOT live in this file. Node's version is
# in .nvmrc and Python's is in .python-version, and both stay authoritative
# locally and in CI: pinning versions here as well would let the two drift.
# mise reads .nvmrc directly; uv reads .python-version and provisions Python
# itself.
#
# Heroku reads .python-version but NOT .nvmrc — its Node buildpack only ever
# looks at package.json's engines.node, which is why that field is pinned to
# the same major (24.x) rather than left open. Bumping .nvmrc across a major
# means bumping engines.node too, or the deploy silently builds the old one.
#
# pnpm is likewise absent — package.json's packageManager field pins it, and
# corepack installs from there. So is uv: it ships only from GitHub releases,
# every machine that matters already has it (the cloud image, Homebrew, CI's
# astral-sh/setup-uv), and bin/bootstrap installs it from Astral directly on the
# rare machine that does not.
#
# Nothing here may resolve through GitHub's API. mise's default backend, aqua,
# looks every pinned version up at api.github.com/repos/.../releases/tags/...,
# which is unauthenticated and rate-limited at 60/hour PER IP. On any shared
# egress — a cloud agent VM, a NAT'd CI runner — that budget is routinely spent
# by other tenants, and the install fails through no fault of ours. The npm
# registry has no such limit, and mise fetches Node from nodejs.org directly.
# =============================================================================

[settings]
# Without this mise ignores .nvmrc entirely.
idiomatic_version_file_enable_tools = ["node"]

[tools]
# npm rather than the default aqua backend — see the note above. Both are the
# projects' own published packages, at the same versions aqua would resolve.
"npm:rust-just" = "1.51.0"
"npm:lefthook" = "2.0.12"

[env]
# Loaded for the shell and for `mise exec`, replacing direnv's dotenv. Django
# reads .env directly regardless, so nothing depends on this to be correct.
_.file = { path = ".env", required = false }
