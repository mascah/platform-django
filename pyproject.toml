# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
]
norecursedirs = ["node_modules"]

# ==== Coverage ====
[tool.coverage.run]
include = ["platform_django/**", "libs/*/src/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
precision = 2

[tool.coverage.xml]
output = "coverage.xml"

# ==== mypy ====
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

exclude = ["libs/.*/tests/"]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== django-migration-linter ====
# The default rule set already treats backward-incompatible operations — DROP or
# RENAME of a column or table, ADD NOT NULL without a default, ALTER of a column
# type — as errors, and data-migration hygiene as non-blocking warnings. That is
# the split we want, so no `--warnings-as-errors`.
[tool.django_migration_linter]
# `sites` migrations live under platform_django/contrib/sites via
# MIGRATION_MODULES; the linter cannot resolve that shimmed path.
exclude_apps = ["sites"]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
# allauth's {% slot %}/{% endslot %} isn't a builtin django tag
custom_blocks = "slot"
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
line-length = 88
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    'ISC',
    "ICN",
    "G",
    'INP',
    'PIE',
    "T20",
    'PYI',
    'PT',
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TC",
    "INT",
    # "ARG", # Unused function argument
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    # "NPY",
    # "AIR",
    "PERF",
    # "FURB",
    # "LOG",
    "RUF",
]
ignore = [
    "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM102", # sometimes it's better to nest
    "COM812", # Trailing comma — handled by formatter
    # Deactivated because it can make the code slow:
    # https://github.com/astral-sh/ruff/issues/7871
]

[tool.ruff.lint.per-file-ignores]
"libs/**/*.py" = ["DJ"]  # Libs are Django-free
# Driving a bin/ script as a subprocess is the whole point of these; the
# "untrusted input" is a literal name and a tmp_path, and eject's exit code is
# asserted rather than raised on.
"tests/test_worktree_create.py" = ["S603"]
"tests/test_worktree_env_hook.py" = ["S603"]
"tests/test_eject.py" = ["S603", "S607", "PLW1510"]

[tool.ruff.lint.isort]
force-single-line = true

[dependency-groups]
dev = [
    "Werkzeug[watchdog]==3.1.4",
    "ipdb==0.13.13",
    "watchfiles==1.2.0",
    "mypy==2.3.0",
    "django-stubs[compatible-mypy]==6.0.7",
    "pytest==9.1.1",
    "pytest-sugar==1.1.1",
    "pytest-cov>=7.1.0,<8.0",
    "djangorestframework-stubs==3.17.1",
    "sphinx==9.1.0",
    "sphinx-autobuild==2025.8.25",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=5.1.0",
    "ruff==0.16.1",
    "coverage==7.15.2",
    "djlint==1.43.1",
    "factory-boy==3.3.3",
    "django-debug-toolbar==6.3.0",
    "django-extensions==4.1",
    "django-coverage-plugin==3.2.2",
    "pytest-django==4.12.0",
    "django-upgrade",
    "import-linter>=2.13",
    "grimp>=3.15",
]

