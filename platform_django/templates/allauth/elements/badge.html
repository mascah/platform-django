{% load allauth %}

{# The tokens carry no success or warning colour, so a badge is either #}
{# neutral or it is a warning worth the destructive colour. #}
<span class="badge {% if 'warning' in attrs.tags or 'danger' in attrs.tags %}badge-warning{% endif %}"
      {% if attrs.title %}title="{{ attrs.title }}"{% endif %}>
  {% slot %}
  {% endslot %}
</span>
