services:
  docs:
    image: platform_django_local_docs
    container_name: platform_django_local_docs
    build:
      context: .
      dockerfile: ./docker/local/docs/Dockerfile
    env_file:
      - ./.env
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./platform_django:/app/platform_django:z
    ports:
      - '9000:9000'
    command: /start-docs
