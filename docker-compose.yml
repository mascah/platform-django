# =============================================================================
# The backing services, shared by every worktree on this machine
# =============================================================================
# Django, Vite and Celery are application processes and run on the host, so
# nothing here is built from this repository — these are stock images.
#
# The project name is fixed rather than derived from the directory, so `just up`
# from any worktree addresses the same containers instead of starting a stack of
# its own. Worktrees isolate by database name and Redis index, not by port, so
# these ports are the same everywhere and never need offsetting.
#
# Compose reads .env from the project directory on its own; no --env-file flag.
# =============================================================================

name: dev-backing-services

volumes:
  postgres_data: {}
  redis_data: {}

services:
  postgres:
    image: docker.io/postgres:18
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      # Only the credentials are shared. Each worktree's own database is created
      # against this instance by `just up`, so the image initialises nothing
      # beyond the `postgres` database it always has.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/redis:8.8
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: docker.io/axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # SMTP for the application, then the web interface.
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
